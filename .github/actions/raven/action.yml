name: Raven library
description: >
  Download the Raven GUI library (Linux x64, static), check it against the
  release's SHA256SUMS.txt and set RAVEN_LIB_DIR and RAVEN_STATIC for the
  rustman-viz build. Also installs the X11 development files the static
  library links.
inputs:
  version:
    description: The Raven release tag
    default: v0.3.0
runs:
  using: composite
  steps:
    - name: X11 development files (the static Raven library links libX11)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev
    - name: Download and verify the Raven library
      shell: bash
      env:
        RAVEN_VERSION: ${{ inputs.version }}
      run: |
        base="https://github.com/oscar-soirey/Raven/releases/download/$RAVEN_VERSION"
        cd "$RUNNER_TEMP"
        curl -fsSLO "$base/raven-linux-x64-static.tar.gz"
        curl -fsSLO "$base/SHA256SUMS.txt"
        grep ' raven-linux-x64-static.tar.gz$' SHA256SUMS.txt | sha256sum -c -
        tar -xzf raven-linux-x64-static.tar.gz
        echo "RAVEN_LIB_DIR=$RUNNER_TEMP/raven-linux-x64-static/lib" >> "$GITHUB_ENV"
        echo "RAVEN_STATIC=1" >> "$GITHUB_ENV"
