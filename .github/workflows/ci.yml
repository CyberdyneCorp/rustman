name: CI

# Spec validation (`openspec validate --all --strict`) runs in openspec-validate.yml.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # add-traffic-recorder task 9.10: --all-targets turns on the
      # `record-test-hooks` feature (rustman-cli's dev-dependency on
      # itself); lint the shipped build, without the hooks, too.
      - run: cargo clippy -p rustman-cli --locked -- -D warnings
      # add-trace-propagation section 4: the OTLP exporter is behind the
      # `otlp` feature, and the default build has no OpenTelemetry crate.
      - run: cargo clippy --workspace --all-targets --locked --features rustman-cli/otlp -- -D warnings
      # add-scheduled-monitors task 5.1: email alerts are behind `smtp`.
      - run: cargo clippy -p rustman-monitor --all-targets --locked --features smtp -- -D warnings
      # add-secret-providers section 4: the cloud secret providers.
      - run: cargo clippy --workspace --all-targets --locked --features rustman-cli/cloud-secrets -- -D warnings
      # docs/secrets.md: each cloud feature can be built on its own.
      - name: Each cloud secret feature on its own
        run: |
          for f in secrets-aws secrets-gcp secrets-azure; do
            cargo clippy -p rustman-secrets --all-targets --locked --features "$f" -- -D warnings
          done
      - name: No OpenTelemetry crate in the default build
        run: |
          if cargo tree --workspace --locked --edges normal --prefix none | grep -E '^opentelemetry'; then
            echo "an OpenTelemetry crate is in the default build"; exit 1
          fi
      # add-plugin-system task 1.2: the plugin API's WIT package parses
      # with wasm-tools (the additive-only check is the wit_api test).
      # Pinned, so a wasm-tools release cannot change what the check
      # accepts (it matches the wit-parser 0.247 of Cargo.lock).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.247.0
      - name: Plugin WIT package parses
        run: wasm-tools component wit crates/rustman-plugin-sdk/wit/plugin.wit > /dev/null
      # add-importers task 2.3: imported scripts are never executed, so no
      # JavaScript engine may enter the dependency tree.
      - name: No JavaScript engine in the dependency tree
        run: |
          if cargo tree --workspace --locked --edges normal --prefix none \
              | grep -Ei '^(boa_engine|rquickjs|quickjs[a-z_-]*|deno_core|v8|mozjs|js-sandbox) '; then
            echo "a JavaScript engine is in the dependency tree"; exit 1
          fi

  # add-load-testing task 1.3: the VU path may add at most 50 µs per
  # request at p50 over the bare engine; the bench fails past that.
  bench-overhead:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p rustman-bench --bench executor --locked

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    # Two full test builds (default and otlp) overflow the Linux runner's
    # disk with full debug info; line tables keep file:line in panics.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Free runner disk (unused preinstalled SDKs)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/share/boost
          docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The completion scripts must parse in bash, zsh and fish (task 6.6);
      # RUSTMAN_REQUIRE_SHELLS turns a missing shell into a test failure.
      - name: Install shells for the completion parse check
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
          echo "RUSTMAN_REQUIRE_SHELLS=1" >> "$GITHUB_ENV"
      # The Ghostman wire regression corpus (add-stress-testing task 4.7)
      # runs a Python fixture server; RUSTMAN_REQUIRE_PYTHON turns a missing
      # interpreter into a test failure instead of a skip, on every OS.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require Python for the wire regression corpus
        shell: bash
        run: echo "RUSTMAN_REQUIRE_PYTHON=1" >> "$GITHUB_ENV"
      # add-docs-generator task 3.3: the search benchmark and the headless
      # browser test need node and Chrome (both preinstalled on the Linux
      # runner); RUSTMAN_REQUIRE_BROWSER turns a missing one into a failure.
      - name: Require node and Chrome for the docs search tests
        if: runner.os == 'Linux'
        run: |
          node --version
          google-chrome --version
          echo "RUSTMAN_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked
      # add-secret-providers task 3.2: decrypt a file the real `sops`
      # binary encrypted for an age key (the other SOPS tests use fixtures
      # written in the SOPS format by the test itself).
      - name: SOPS files from the sops binary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y age
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          RUSTMAN_REQUIRE_SOPS=1 cargo test -p rustman-secrets --locked --test sops real_sops
      # add-secret-providers tasks 4.1-4.3: the cloud providers against
      # local stubs, and the secret commands of a build with all of them.
      # A third rustman-cli test build would overflow the Linux runner's
      # disk (see the otlp step), so Linux runs the CLI part in the
      # release-secrets job.
      - name: Cloud secret providers
        run: cargo test -p rustman-secrets --locked --features secrets-aws,secrets-gcp,secrets-azure
      - name: Secret commands with every cloud provider
        if: runner.os != 'Linux'
        run: cargo test -p rustman-cli --locked --features cloud-secrets --test secret_cli --test secret_providers
      # add-secret-providers task 2.2: "Cloud type in a minimal build".
      - name: Secret providers in a minimal build
        run: |
          cargo test -p rustman-secrets --no-default-features --locked --test builtin cloud_type_in_a_minimal_build
          cargo build -p rustman-cli --no-default-features --locked
      # add-plugin-system task 1.1: plugins (wasmtime) are a default
      # feature; the binary also builds without them.
      - name: Build and test without plugins
        run: |
          cargo build -p rustman-cli --no-default-features --locked
          cargo test -p rustman-cli --no-default-features --locked --bin rustman
      # add-trace-propagation section 4: everything again with OTLP export
      # built in on Linux; macOS and Windows run the export tests against
      # the in-process collector (task 5.1's in-process variant).
      - name: Tests with the otlp feature
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked --features rustman-cli/otlp
      - name: OTLP export tests (in-process collector)
        if: runner.os != 'Linux'
        run: |
          cargo test -p rustman-http --features otlp --locked --test otlp
          cargo test -p rustman-http --features otlp --locked --lib otlp
          cargo test -p rustman-cli --features otlp --locked --test otlp
      # add-scheduled-monitors task 5.1: the email channel against the
      # local SMTP stub (STARTTLS, implicit TLS, no plain text).
      - name: Monitor email alerts (smtp feature)
        run: cargo test -p rustman-monitor --features smtp --locked
      # add-grpc-client task 6.3: an agent server built without gRPC
      # registers none of the gRPC tools.
      - name: Agent tools without gRPC
        run: cargo test -p rustman-mcp --no-default-features --locked --lib tools::tests
      # add-terminal-ui task 9.1 (also part of the run above; repeated here
      # so the job shows the TUI smoke result per OS). The real TUI runs in
      # a pty (ConPTY on Windows); the same flow also runs through the real
      # event loop with an in-memory terminal (see docs/tui.md, "Platform
      # checks").
      - name: TUI smoke test (pty)
        run: cargo test -p rustman-tui --locked --test pty_smoke
      - name: TUI smoke test (event loop)
        run: cargo test -p rustman-tui --locked --lib smoke_tests
      # Task 3.4: the real OS keychain round trip. Windows runners have the
      # Credential Manager; macOS is run manually (the runner keychain is
      # locked) and Linux has no Secret Service on the runner.
      - name: OS keychain tests
        if: runner.os == 'Windows'
        run: cargo test -p rustman-core --locked -- --ignored keychain
      # Keep in sync with the "Quick start" section of README.md.
      - name: Smoke test README quick start
        shell: bash
        run: |
          # The release build needs room the test builds have used up.
          if [ "$RUNNER_OS" = Linux ]; then rm -rf target/debug/incremental target/debug/examples; df -h /; fi
          cargo install --path crates/rustman-cli --locked
          rustman --version
          rustman --help
          cd "$RUNNER_TEMP" && rustman init my-api
          cd my-api && rustman env list

  # Task 8.1: the end-to-end test needs nothing beyond loopback. It is built
  # with network access, then run in a network namespace that has only `lo`.
  e2e-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustman-cli --test e2e --locked --no-run
      - name: Run the end-to-end test without network access
        run: |
          sudo unshare --net -- env "PATH=$PATH" "HOME=$HOME" \
            "CARGO_TERM_COLOR=$CARGO_TERM_COLOR" "UID_GID=$(id -u):$(id -g)" \
            bash -euc '
              ip link set lo up
              exec setpriv --reuid="${UID_GID%:*}" --regid="${UID_GID#*:}" --init-groups -- bash -euc "
                if curl -sS --max-time 5 https://github.com >/dev/null; then
                  echo the network is reachable; exit 1
                fi
                cargo test -p rustman-cli --test e2e --locked --offline
              "
            '

  # add-openapi-mock-server task 7.3: the explorer's conformance probes find
  # nothing against a mock of the same document (exit 0, zero findings).
  mock-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rustman-cli --locked
      # add-traffic-recorder task 9.10: the record test hooks exist only in
      # test builds, so a default build ignores the stand-in keychain.
      - name: A default debug build has no record test hooks
        shell: bash
        run: |
          # The step shell runs with -e; `ca init` is expected to fail.
          set +e
          tmp="$RUNNER_TEMP/hooks-debug"
          mkdir -p "$tmp/ws" "$tmp/keychain" "$tmp/config"
          printf '[workspace]\nname = "hooks"\nversion = 1\n' > "$tmp/ws/rustman.toml"
          cd "$tmp/ws"
          RUSTMAN_SECRET_STORE=file RUSTMAN_RECORD_TEST_KEYCHAIN="$tmp/keychain" \
            XDG_CONFIG_HOME="$tmp/config" "$GITHUB_WORKSPACE/target/debug/rustman" record ca init
          code=$?
          if [ "$code" -ne 2 ] || [ -n "$(ls -A "$tmp/keychain")" ]; then
            echo "the build honors RUSTMAN_RECORD_TEST_KEYCHAIN (exit $code)"; exit 1
          fi
      - name: Conformance probes against the mock of fixtures/petstore.yaml
        shell: bash
        run: |
          set -euo pipefail
          bin="$PWD/target/debug/rustman"
          spec="$PWD/fixtures/petstore.yaml"
          ws="$RUNNER_TEMP/selfcheck"
          mkdir -p "$ws/environments"
          printf '[workspace]\nname = "selfcheck"\nversion = 1\n' > "$ws/rustman.toml"
          printf 'variables:\n  bearerAuth_token: mock-token\n  apiKey_key: mock-key\n' > "$ws/environments/ci.yaml"
          cd "$ws"
          "$bin" mock serve "$spec" --port 0 > banner.txt 2> mock.log &
          mock=$!
          trap 'kill -INT "$mock" || true' EXIT
          for _ in $(seq 300); do grep -q "serving" banner.txt && break; sleep 0.1; done
          url=$(sed -n 's/^mock: serving .* on //p' banner.txt)
          "$bin" explore run --spec "$spec" --target "$url" --probes conformance \
            --fail-on info --env ci --allow-destructive

  # add-jsonrpc-client task 8.1: `rustman run` over the JSON-RPC fixture
  # collection against a local Anvil node (blocks every second, so the
  # newHeads subscription gets its events), then the rustman-evm Anvil
  # tests. Nothing leaves loopback.
  jsonrpc-anvil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cargo test -p rustman-cli --test rpc_run --locked --no-run
      - name: Run the JSON-RPC collection against Anvil
        run: |
          anvil --host 127.0.0.1 --port 8545 --block-time 1 --silent &
          for _ in $(seq 1 30); do
            curl -sf -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId"}' \
              http://127.0.0.1:8545 && break
            sleep 1
          done
          RUSTMAN_ANVIL_URL=http://127.0.0.1:8545 \
            cargo test -p rustman-cli --test rpc_run --locked -- --nocapture
      # add-evm-toolkit section 3: calls, traces, streams and forks
      # against Anvils the tests start themselves (forge compiles and
      # deploys the fixture token offline, so solc is installed first);
      # required here, skipped in the hermetic test jobs.
      - name: Install solc 0.8.26 for the fixture token
        run: |
          project="$(mktemp -d)"
          mkdir "$project/src"
          cp crates/rustman-evm/tests/fixtures/contracts/TestToken.sol "$project/src/"
          printf '[profile.default]\nsolc = "0.8.26"\n' > "$project/foundry.toml"
          forge build --root "$project"
      - name: Run the EVM toolkit tests against Anvil
        env:
          RUSTMAN_REQUIRE_ANVIL: "1"
        run: cargo test -p rustman-evm --test anvil --locked -- --nocapture

  # add-messaging-client tasks 2.1-2.3, 5.1 and 6.1: Kafka produce and
  # consume, a `start: before_next` consume in a run and the CLI, against
  # Redpanda (PLAINTEXT on 9092, SASL SCRAM-SHA-512 on 9093). The broker
  # tests return early everywhere else; here RUSTMAN_REQUIRE_BROKERS makes
  # a missing variable a failure. After them, the PLAINTEXT broker
  # must have no consumer group (consume joins none and commits nothing).
  messaging-kafka:
    runs-on: ubuntu-latest
    env:
      REDPANDA_IMAGE: redpandadata/redpanda:v24.2.27
      SCRAM_PASSWORD: rustman-ci-scram
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p rustman-messaging --test kafka_broker --test runner --locked --no-run
          cargo test -p rustman-cli --test messaging --locked --no-run
      - name: Start the brokers
        run: |
          docker run -d --name redpanda -p 9092:9092 "$REDPANDA_IMAGE" redpanda start \
            --mode dev-container --smp 1 \
            --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://127.0.0.1:9092
          docker run -d --name redpanda-scram -p 9093:9093 "$REDPANDA_IMAGE" redpanda start \
            --mode dev-container --smp 1 \
            --kafka-addr SASL://0.0.0.0:9093 --advertise-kafka-addr SASL://127.0.0.1:9093
          for name in redpanda redpanda-scram; do
            healthy=false
            for _ in $(seq 1 60); do
              if docker exec "$name" rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true'; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [ "$healthy" != true ]; then docker logs "$name"; echo "$name is not healthy"; exit 1; fi
          done
          docker exec redpanda-scram rpk security user create rustman \
            -p "$SCRAM_PASSWORD" --mechanism SCRAM-SHA-512
          docker exec redpanda-scram rpk cluster config set superusers '["rustman"]'
          docker exec redpanda-scram rpk cluster config set enable_sasl true
          docker exec redpanda-scram rpk topic create scram-check \
            -X brokers=127.0.0.1:9093 -X user=rustman -X pass="$SCRAM_PASSWORD" \
            -X sasl.mechanism=SCRAM-SHA-512
      - name: Produce and consume through rustman-messaging
        env:
          RUSTMAN_KAFKA_BROKERS: 127.0.0.1:9092
          RUSTMAN_KAFKA_SCRAM_BROKERS: 127.0.0.1:9093
          RUSTMAN_KAFKA_SCRAM_PASSWORD: rustman-ci-scram
          # A missing broker variable fails the tests instead of skipping them.
          RUSTMAN_REQUIRE_BROKERS: kafka
        run: |
          cargo test -p rustman-messaging --test kafka_broker --test runner --locked -- --nocapture
          cargo test -p rustman-cli --test messaging --locked -- --nocapture
      - name: No consumer group was joined
        run: |
          groups=$(docker exec redpanda rpk group list | tail -n +2)
          if [ -n "$groups" ]; then echo "unexpected consumer groups: $groups"; exit 1; fi

  # add-messaging-client tasks 3.1-3.4: MQTT against Mosquitto (plain on
  # 1883, mutual TLS on 8883 with certificates made here) and AMQP against
  # RabbitMQ. The broker tests return early everywhere else; here
  # RUSTMAN_REQUIRE_BROKERS makes a missing variable a failure.
  messaging-mqtt-amqp:
    runs-on: ubuntu-latest
    env:
      MOSQUITTO_IMAGE: eclipse-mosquitto:2.0.22
      RABBITMQ_IMAGE: rabbitmq:4.1.4-alpine
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustman-messaging --test mosquitto --test rabbitmq --locked --no-run
      - name: Make the TLS certificates
        run: |
          dir="$RUNNER_TEMP/mqtt-tls"
          mkdir -p "$dir"
          cd "$dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Rustman CI CA" \
            -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
            -extfile server.ext -out server.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=rustman-client" -keyout client.key -out client.csr
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -out client.pem
          chmod 644 ./*
          printf 'listener 1883\nallow_anonymous true\n\nlistener 8883\ncafile /tls/ca.pem\ncertfile /tls/server.pem\nkeyfile /tls/server.key\nrequire_certificate true\n' > mosquitto.conf
          echo "RUSTMAN_MQTT_TLS_DIR=$dir" >> "$GITHUB_ENV"
      - name: Start the brokers
        run: |
          docker run -d --name mosquitto -p 1883:1883 -p 8883:8883 \
            -v "$RUSTMAN_MQTT_TLS_DIR:/tls:ro" "$MOSQUITTO_IMAGE" mosquitto -c /tls/mosquitto.conf
          docker run -d --name rabbitmq -p 5672:5672 "$RABBITMQ_IMAGE"
          ready=false
          for _ in $(seq 1 90); do
            if nc -z 127.0.0.1 1883 && nc -z 127.0.0.1 8883 \
              && nc -z 127.0.0.1 5672 \
              && docker logs rabbitmq 2>&1 | grep -q "Server startup complete"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs mosquitto; docker logs rabbitmq; echo "the brokers are not ready"; exit 1
          fi
      - name: Publish and consume through rustman-messaging
        env:
          RUSTMAN_MQTT_BROKER: mqtt://127.0.0.1:1883
          RUSTMAN_MQTTS_BROKER: mqtts://localhost:8883
          RUSTMAN_AMQP_BROKER: amqp://guest:guest@127.0.0.1:5672/%2f
          # A missing broker variable fails the tests instead of skipping them.
          RUSTMAN_REQUIRE_BROKERS: mqtt,amqp
        run: cargo test -p rustman-messaging --test mosquitto --test rabbitmq --locked -- --nocapture

  # add-secret-providers task 4.1: aws-secrets-manager and aws-ssm against
  # LocalStack (a JSON secret with a field, a SecureString parameter).
  secrets-localstack:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.8
        ports: [ "4566:4566" ]
        env:
          SERVICES: secretsmanager,ssm
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustman-secrets --features secrets-aws --test aws --locked --no-run
      - name: Create the secret and the parameter
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:4566/_localstack/health >/dev/null && break
            sleep 1
          done
          aws --endpoint-url http://127.0.0.1:4566 secretsmanager create-secret \
            --name prod/db --secret-string '{"password":"localstack-password"}'
          aws --endpoint-url http://127.0.0.1:4566 ssm put-parameter \
            --name /app/key --type SecureString --value localstack-parameter
      - name: Resolve them through the providers
        env:
          RUSTMAN_LOCALSTACK_URL: http://127.0.0.1:4566
        run: cargo test -p rustman-secrets --features secrets-aws --test aws --locked localstack -- --nocapture

  # add-secret-providers task 3.4: the vault provider against a real
  # `vault server -dev` (KV v2 with versions, and a token without access).
  secrets-vault:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.17
        ports: [ "8200:8200" ]
        env:
          VAULT_DEV_ROOT_TOKEN_ID: rustman-dev-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    env:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: rustman-dev-root
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustman-secrets --test vault --locked --no-run
      - name: Write two versions of secret/app and a limited token
        run: |
          for _ in $(seq 1 60); do
            curl -sf "$VAULT_ADDR/v1/sys/health" >/dev/null && break
            sleep 1
          done
          for v in 1 2; do
            curl -sf -H "X-Vault-Token: $VAULT_TOKEN" -X POST \
              -d "{\"data\":{\"password\":\"dev-password-v$v\"}}" \
              "$VAULT_ADDR/v1/secret/data/app"
          done
          curl -sf -H "X-Vault-Token: $VAULT_TOKEN" -X PUT \
            -d '{"policy":"path \"secret/data/other\" { capabilities = [\"read\"] }"}' \
            "$VAULT_ADDR/v1/sys/policies/acl/other-only"
          limited=$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN" -X POST \
            -d '{"policies":["other-only"],"ttl":"10m"}' \
            "$VAULT_ADDR/v1/auth/token/create" | jq -r .auth.client_token)
          echo "::add-mask::$limited"
          echo "RUSTMAN_VAULT_LIMITED_TOKEN=$limited" >> "$GITHUB_ENV"
      - name: Resolve them through the provider
        env:
          RUSTMAN_VAULT_ADDR: http://127.0.0.1:8200
          RUSTMAN_VAULT_TOKEN: rustman-dev-root
        run: cargo test -p rustman-secrets --test vault --locked vault_dev_server -- --nocapture

  # add-secret-providers task 4.4: release binaries carry every cloud
  # secret provider (feature cloud-secrets), and the cloud providers add at
  # most 2 MiB to the default release binary.
  release-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rustman-cli --locked
      - run: cp target/release/rustman "$RUNNER_TEMP/rustman-default"
      # add-traffic-recorder task 9.10: the record test hooks exist only in
      # test builds, so a default build ignores the stand-in keychain.
      - name: A default release build has no record test hooks
        shell: bash
        run: |
          # The step shell runs with -e; `ca init` is expected to fail.
          set +e
          tmp="$RUNNER_TEMP/hooks-release"
          mkdir -p "$tmp/ws" "$tmp/keychain" "$tmp/config"
          printf '[workspace]\nname = "hooks"\nversion = 1\n' > "$tmp/ws/rustman.toml"
          cd "$tmp/ws"
          RUSTMAN_SECRET_STORE=file RUSTMAN_RECORD_TEST_KEYCHAIN="$tmp/keychain" \
            XDG_CONFIG_HOME="$tmp/config" "$RUNNER_TEMP/rustman-default" record ca init
          code=$?
          if [ "$code" -ne 2 ] || [ -n "$(ls -A "$tmp/keychain")" ]; then
            echo "the build honors RUSTMAN_RECORD_TEST_KEYCHAIN (exit $code)"; exit 1
          fi
      - run: cargo build --release -p rustman-cli --locked --features cloud-secrets
      - name: Every provider type is in the release binary
        run: |
          types=" $(target/release/rustman secret list-providers --types | tr '\n' ' ')"
          for t in keychain env sops onepassword vault cmd aws-secrets-manager aws-ssm \
                   gcp-secret-manager azure-key-vault; do
            case "$types" in *" $t "*) ;; *) echo "provider type $t is missing"; exit 1 ;; esac
          done
      - name: Binary size budget
        run: |
          default=$(stat -c %s "$RUNNER_TEMP/rustman-default")
          release=$(stat -c %s target/release/rustman)
          echo "default $default bytes, with the cloud providers $release bytes"
          if [ $((release - default)) -gt $((2 * 1024 * 1024)) ]; then
            echo "the cloud secret providers add more than 2 MiB"; exit 1
          fi
      # The Linux part of the test job's "Secret commands with every cloud
      # provider" step, on this job's own disk.
      - name: Secret commands with every cloud provider
        run: cargo test -p rustman-cli --locked --features cloud-secrets --test secret_cli --test secret_providers

  # add-trace-propagation task 5.1: `rustman run` with `scope: run` against
  # HotROD (an API instrumented with OpenTelemetry), with Rustman and HotROD
  # both exporting to Jaeger all-in-one; the test asserts one trace holds
  # both services and that the printed Jaeger link answers 200.
  trace-jaeger:
    runs-on: ubuntu-latest
    services:
      jaeger:
        image: jaegertracing/all-in-one:1.60.0
        ports: [ "16686:16686", "4317:4317", "4318:4318" ]
      hotrod:
        image: jaegertracing/example-hotrod:1.60.0
        ports: [ "8080:8080" ]
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustman-cli --features otlp --test otlp --locked --no-run
      - name: Wait for Jaeger and HotROD
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:16686/ >/dev/null \
              && curl -sf http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          echo "Jaeger or HotROD did not start"; exit 1
      - name: Run against HotROD, exporting to Jaeger
        env:
          RUSTMAN_JAEGER_URL: http://127.0.0.1:16686
          RUSTMAN_JAEGER_OTLP: http://127.0.0.1:4317
          RUSTMAN_TRACED_API_URL: http://127.0.0.1:8080
        run: cargo test -p rustman-cli --features otlp --test otlp --locked jaeger -- --ignored --nocapture

  # add-raven-visualizer task 1.3: the viz protocol decoder never panics.
  fuzz-viz-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz the decoder for 60 s
        working-directory: crates/rustman-viz-protocol
        run: cargo +nightly fuzz run decode -- -max_total_time=60

  # add-realtime-client task 3.1: the SSE parser never panics, and how a
  # stream is split into chunks never changes what it parses to.
  fuzz-sse-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz the SSE parser for 60 s
        working-directory: crates/rustman-http
        run: cargo +nightly fuzz run sse_parser -- -max_total_time=60

  # Runner-parity task 4.4: every snippet language with an interpreter on the
  # runner sends the same request to the local echo server. Languages listed
  # in RUSTMAN_REQUIRE_SNIPPET_LANGS (all 11) fail the job when their tool
  # is missing. axios is installed in a folder of its own, and reqwest is
  # fetched by cargo for the rust-reqwest snippet.
  snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install HTTP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget httpie python3-requests python3-httpx
          mkdir -p "$RUNNER_TEMP/axios"
          npm install --prefix "$RUNNER_TEMP/axios" axios@1
      - run: cargo test -p rustman-cli --test snippet_run --locked -- --ignored --nocapture
        env:
          RUSTMAN_SNIPPET_NODE_DIR: ${{ runner.temp }}/axios
          RUSTMAN_SNIPPET_CARGO: "1"
          RUSTMAN_SNIPPET_CARGO_TARGET: ${{ runner.temp }}/reqwest-target
          RUSTMAN_REQUIRE_SNIPPET_LANGS: curl,wget,httpie,python-requests,python-httpx,js-fetch,node-axios,go,rust-reqwest,powershell,csharp

  # add-mcp-client task 3.5: the MCP client against the reference server
  # (@modelcontextprotocol/server-everything, run locally over stdio).
  mcp-reference-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the reference server
        run: |
          mkdir -p "$RUNNER_TEMP/everything"
          npm install --prefix "$RUNNER_TEMP/everything" --ignore-scripts @modelcontextprotocol/server-everything@2.2.1
      - run: cargo test -p rustman-mcp --test client_everything --locked -- --ignored --nocapture
        env:
          RUSTMAN_MCP_EVERYTHING: ${{ runner.temp }}/everything/node_modules/@modelcontextprotocol/server-everything/dist/index.js

  # add-raven-visualizer tasks 3.1, 3.3-3.5, 4.5: the optional companion
  # builds against the pinned Raven release and its tests run with Raven's
  # headless backend (no window system, no GPU). It has its own workspace,
  # so the jobs above never fetch or build Raven.
  viz-companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/rustman-viz
    env:
      RAVEN_VERSION: v0.3.0
      RAVEN_STATIC: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        working-directory: .
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rustman-viz
      - name: X11 development files (the static Raven library links libX11)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - name: Download and verify the Raven library
        run: |
          base="https://github.com/oscar-soirey/Raven/releases/download/$RAVEN_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/raven-linux-x64-static.tar.gz"
          curl -fsSLO "$base/SHA256SUMS.txt"
          grep ' raven-linux-x64-static.tar.gz$' SHA256SUMS.txt | sha256sum -c -
          tar -xzf raven-linux-x64-static.tar.gz
          echo "RAVEN_LIB_DIR=$RUNNER_TEMP/raven-linux-x64-static/lib" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features raven --locked -- -D warnings
      - name: Tests (models without Raven, then the executable, headless)
        run: |
          cargo test --locked
          cargo test --features raven --locked
      - name: No HTTP client in the companion (read-only, task 4.5)
        run: |
          if cargo tree --features raven --locked --edges normal --prefix none \
              | grep -E '^(hyper|hyper-util|reqwest|ureq|rustman-http|rustman-core|tokio) '; then
            echo "the companion must not depend on an HTTP client"; exit 1
          fi
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/rustman-viz/Cargo.toml
          command: check
          arguments: --all-features
  # add-contract-testing task 6.3: the official Pact verifier verifies the
  # Pact files we generate against the same fixture provider as ours, and
  # the verdicts must match. pact_verifier_cli is a pinned release whose
  # checksum is checked before it runs.
  pact-interop:
    runs-on: ubuntu-latest
    env:
      PACT_VERIFIER_VERSION: 1.4.0
      PACT_VERIFIER_SHA256: 6bf564df3b830a831095beb3720405cbd1c99fb02e7147de93383d5885213482
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Download pact_verifier_cli
        run: |
          mkdir -p "$RUNNER_TEMP/pact"
          cd "$RUNNER_TEMP/pact"
          curl -fsSL --retry 3 -o pact-verifier.gz \
            "https://github.com/pact-foundation/pact-reference/releases/download/pact_verifier_cli-v${PACT_VERIFIER_VERSION}/pact-verifier-linux-x86_64.gz"
          echo "${PACT_VERIFIER_SHA256}  pact-verifier.gz" | sha256sum -c -
          gunzip pact-verifier.gz
          chmod +x pact-verifier
          echo "PACT_VERIFIER_CLI=$RUNNER_TEMP/pact/pact-verifier" >> "$GITHUB_ENV"
      - run: cargo test -p rustman-contract --test pact_interop --locked -- --nocapture

  # add-plugin-system task 6.2 ("Scaffold builds"): every `rustman plugin
  # new` template scaffolds, builds to wasm32-wasip2 against this
  # repository's SDK, passes `rustman plugin test` and is accepted by
  # `rustman plugin add`; the SDK's guest bindings pass clippy on wasm.
  plugin-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Add the plugin target
        run: rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check_plugin_templates.py

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
