name: Docs

# Builds the documentation book (book.toml, sources in docs/) with a pinned
# mdBook, checks its links offline, and on main deploys it to GitHub Pages.
# The repository's Pages source must be "GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Not MDBOOK_*: mdBook reads those variables as configuration.
  DOCS_MDBOOK_VERSION: v0.5.4
  DOCS_MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the sources (SUMMARY, relative links, anchors)
        run: python3 scripts/check_docs.py
      - name: Install mdBook ${{ env.DOCS_MDBOOK_VERSION }}
        run: |
          archive="mdbook-${DOCS_MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/${DOCS_MDBOOK_VERSION}/$archive"
          echo "${DOCS_MDBOOK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - run: mdbook --version
      - name: Build the book
        run: mdbook build
      - name: Check the built site's internal links
        run: python3 scripts/check_docs.py --html book
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
