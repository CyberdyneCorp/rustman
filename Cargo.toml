[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CyberdyneCorp/rustman"

[workspace.dependencies]
rustman-core = { path = "crates/rustman-core", version = "0.1.0" }
rustman-http = { path = "crates/rustman-http", version = "0.1.0" }
rustman-report = { path = "crates/rustman-report", version = "0.1.0" }

clap = { version = "4", features = ["derive"] }

assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
