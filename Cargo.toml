[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CyberdyneCorp/rustman"

[workspace.dependencies]
rustman-core = { path = "crates/rustman-core", version = "0.1.0" }
rustman-http = { path = "crates/rustman-http", version = "0.1.0" }
rustman-report = { path = "crates/rustman-report", version = "0.1.0" }
rustman-import = { path = "crates/rustman-import", version = "0.1.0" }
rustman-explore = { path = "crates/rustman-explore", version = "0.1.0" }
# Test servers shared by the integration tests; never published.
rustman-test-support = { path = "crates/rustman-test-support" }
rustman-tui = { path = "crates/rustman-tui", version = "0.1.0" }
rustman-viz-protocol = { path = "crates/rustman-viz-protocol", version = "0.1.0" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Pinned per design D4; only used behind rustman_core::format.
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
# preserve_order keeps JSON body keys in file order (round trip, D4).
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
thiserror = "2"
toml = "1"
# Redactor (design D7): one linear pass over large bodies for every secret form.
aho-corasick = "1"
# Dynamic variables (design D8): {{$uuid}}, {{$random*}} and {{$isoTimestamp}}.
rand = "0.10"
time = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["std", "v4"] }
# OS keychains for secrets (design D6), all pure Rust with no system libraries.
# macOS Keychain and Windows Credential Manager go through keyring-core stores;
# Linux talks to the Secret Service with oo7 (zbus 6, Rust crypto, no libdbus or
# OpenSSL). The keyring 3.x Secret Service backends depend on unmaintained zbus
# 4/5 crates (RUSTSEC-2026-0370..0372), so they are not used.
keyring-core = "1.0.1"
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
oo7 = { version = "0.7.1", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = { version = "2.6", default-features = false, features = ["std"] }
# No-echo prompt for `rustman secret set` (CLI only).
rpassword = "7.5"

# Canonical paths without Windows' `\\?\` prefix, for paths shown to users or
# passed to `git`.
dunce = "1"

# HTTP transport (design D2): hyper + hyper-util client with our own timed
# connector. reqwest is rejected because it cannot time DNS, TCP and TLS apart.
hyper = { version = "1.9", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
http = "1"
http-body-util = "0.1.5"
bytes = "1"
tower-service = "0.3.3"
tokio = { version = "1.50", default-features = false }
# Run cancellation (design D10) and joining folder units on one task.
tokio-util = { version = "0.7.20", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
form_urlencoded = "1.2"
# TLS (design D3): rustls with ring and the OS trust store; no aws-lc-rs, no OpenSSL.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7.1"
rustls-pki-types = { version = "1.12", features = ["std"] }
# Platform roots added to a `ca_bundle` for the webpki verifier (design D3).
rustls-native-certs = "0.8"
# mTLS from PKCS#12 bundles (design D3), pure Rust. PEM files are parsed with
# rustls-pki-types (rustls-pemfile is deprecated and wraps the same parser).
p12-keystore = "0.4.1"
# Proxies (design D2): SOCKS5 tunnels; HTTP CONNECT is hand-written.
tokio-socks = { version = "0.5.3", default-features = false, features = ["tokio"] }
# Redirect `Location` resolution and proxy URLs (already in the tree via hickory).
url = "2.5"
percent-encoding = "2.3"
# `Proxy-Authorization: Basic` credentials.
base64 = "0.23"
# Server-side compression in tests (and response decoding, design D2).
async-compression = { version = "0.4.50", default-features = false }
http-body = "1"
# Test certificates for the in-process test server.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }

# Cookie jars per environment (design D2): RFC 6265 storage, saved as JSON.
cookie_store = { version = "0.22.1", default-features = false, features = ["serde_json"] }
# OAuth2 PKCE (S256 challenge, random verifier and state); already in the tree via rustls.
ring = { version = "0.17.14", default-features = false }

# Curl interop (design D13): tokenizing on import, POSIX quoting on export.
shell-words = "1.1"
shell-escape = "0.1.5"
# Assertions (design D9): RFC 9535 JSONPath, JSON Schema 2020-12 / draft-07
# without remote `$ref` resolution (no reqwest, no TLS stack), and linear-time
# regular expressions.
serde_json_path = "0.7.2"
jsonschema = { version = "0.61.2", default-features = false }
regex = "1.13"
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
# The current user id (safe `geteuid`), for per-user private temp folders on Unix.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
# Peak heap usage in the body memory-ceiling test (a counting global allocator).
peak_alloc = "0.3"

# OpenAPI 3.0/3.1 model (add-openapi-explorer design D1), lowered into the
# explorer's own IR. `openapiv3` (3.0 only) is rejected; `yaml-spec` is off
# because YAML goes through rustman_core::format.
oas3 = { version = "0.22", default-features = false }

# Reporters (design D11 and the cli-runner spec): JUnit XML for CI.
quick-junit = "0.8"
# Report renderers (add-openapi-explorer design D9): the exploration part of
# the report JSON Schema derived from the Rust types, and Markdown/HTML
# templates with inlined assets (minijinja, shared with snippet export below).
# SARIF is a small typed serde writer: serde-sarif was rejected for its
# build-time code generation (schemafy, syn).
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }
# Terminal output (design D11): color that honors NO_COLOR, TERM=dumb, TTYs
# and `--color`; completions; logs for `-v` and RUST_LOG.
anstream = "1"
anstyle = "1"
clap_complete = "4.6"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std", "tracing-log"] }
# Snapshot tests (reporters, help output) and the JUnit check in tests.
insta = { version = "1", default-features = false }
roxmltree = "0.21"
# Governed senders (safety policy, design D4/D5): GCRA rate limiting, a
# runtime-agnostic concurrency semaphore and timer, and `Retry-After` dates.
governor = { version = "0.10.4", default-features = false, features = ["std"] }
async-lock = "3.5"
futures-timer = "3.0.3"
httpdate = "1.0.3"

# Data rows (runner parity D1): RFC 4180 CSV for `rustman run --data`.
csv = "1.4"
# Signature auth (runner parity D4-D6): the AWS SDK's SigV4 signer without its
# runtime, JWT signing on ring, and MD5 for Digest (SHA-256 comes from ring).
aws-sigv4 = { version = "1.6.6", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = { version = "1", default-features = false }
jsonwebtoken = { version = "9.3.1", default-features = false, features = ["use_pem"] }
md-5 = { version = "0.11", default-features = false }
# Snippet export (runner parity D7): one sandboxed template per language;
# also the Markdown/HTML report templates.
minijinja = { version = "3.1", default-features = false, features = ["builtins", "serde"] }

assert_cmd = "2"
predicates = "3"

# Terminal UI (add-terminal-ui design D1): ratatui over crossterm. cursive
# (retained mode) and termion (no Windows) are rejected.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
# Pseudo-terminal for the panic-restores-the-terminal test (Unix only).
portable-pty = "0.9"
# Terminal emulator for the TUI pty smoke test: turns the bytes the TUI
# writes into a screen to assert on. Matching raw escape output is rejected
# (ratatui redraws only changed cells, so text is split by cursor moves).
vt100 = "0.18"
# Fuzzy matching for the command palette (add-terminal-ui task 3.2): the
# matcher of `nucleo`, used synchronously; the `nucleo` worker pool is not
# needed for a few hundred entries. `fuzzy-matcher` (unmaintained) and
# `sublime_fuzzy` (no Unicode case folding) are rejected.
nucleo-matcher = { version = "0.3.1", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }
# File watching for open request files (add-terminal-ui task 4.3): inotify,
# FSEvents and ReadDirectoryChangesW without native libraries. Polling every
# file from the UI loop is rejected (I/O on the render loop).
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
# Response viewer (add-terminal-ui design D6; JSONPath filters reuse
# `serde_json_path` above). Highlighting of non-JSON bodies with the bundled Sublime syntaxes, matched
# by pure-Rust `fancy-regex` (the default `onig` needs a C library build).
# Scopes map to theme tokens, so no syntect themes are loaded.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# Line diffs of non-JSON bodies in the exchange diff.
similar = { version = "3.2", default-features = false, features = ["std", "text"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
