# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on vulnerabilities, unmaintained and unsound crates, and yanked versions.
yanked = "deny"
ignore = [
    # chrono is unmaintained, with no fixed version. It comes only through
    # quick-junit (the JUnit reporter, design D11), which uses it for optional
    # timestamps that Rustman never sets. Not a vulnerability; revisit when
    # quick-junit moves off chrono.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained chrono via quick-junit; no timestamps are parsed or formatted" },
    # bincode 1.3.3 is unmaintained but declared complete by its authors. It
    # comes only through syntect (the TUI's body highlighting), which uses it
    # to load its own bundled syntax definitions; no untrusted input is
    # decoded with it. Not a vulnerability.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained bincode via syntect; decodes only syntect's bundled syntax dump" },
]

[licenses]
# Every dependency must be compatible with Rustman's MIT OR Apache-2.0 license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    # MIT without the attribution clause (borrow-or-share, via jsonschema).
    "MIT-0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# MPL-2.0 is file-level copyleft and compatible with distributing Rustman
# under MIT OR Apache-2.0 when the crate is used unmodified. Allowed only for
# the command palette's fuzzy matcher, not workspace-wide.
exceptions = [
    { allow = ["MPL-2.0"], crate = "nucleo-matcher" },
    # CC0-1.0 is a public-domain dedication, compatible with MIT OR
    # Apache-2.0. Allowed only for the TUI's file watcher.
    { allow = ["CC0-1.0"], crate = "notify" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The default binary must not link system TLS libraries (openspec/config.yaml).
deny = [
    { crate = "openssl-sys", reason = "system OpenSSL is not allowed; use rustls" },
    { crate = "openssl", reason = "system OpenSSL is not allowed; use rustls" },
    { crate = "native-tls", reason = "system TLS is not allowed; use rustls" },
    { crate = "aws-lc-rs", reason = "rustls uses the ring provider (design D3)" },
    { crate = "aws-lc-sys", reason = "rustls uses the ring provider (design D3)" },
    # Imported scripts are never executed (add-importers design D3): no JS engine.
    { crate = "boa_engine", reason = "imported scripts are never executed" },
    { crate = "rquickjs", reason = "imported scripts are never executed" },
    { crate = "quickjs-rs", reason = "imported scripts are never executed" },
    { crate = "deno_core", reason = "imported scripts are never executed" },
    { crate = "v8", reason = "imported scripts are never executed" },
    { crate = "mozjs", reason = "imported scripts are never executed" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
