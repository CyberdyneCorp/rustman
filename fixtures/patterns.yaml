openapi: 3.0.3
info:
  title: Patterns
  version: '1'
paths:
  /codes:
    get:
      operationId: getCodes
      responses:
        '200':
          description: Codes that only a generated string matches
          content:
            application/json:
              schema:
                type: object
                required: [a, b, c]
                properties:
                  a:
                    type: string
                    pattern: '^(a+)+$'
                  b:
                    type: string
                    pattern: '^[A-Z]{3}-[0-9]{4}$'
                  c:
                    type: string
                    maxLength: 12
                    pattern: '^\d{2}\.\w+$'
  /deep:
    get:
      operationId: getDeep
      responses:
        '200':
          description: Required members nested past the depth cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/L1'
components:
  schemas:
    L1:
      type: object
      required: [l2]
      properties:
        l2:
          $ref: '#/components/schemas/L2'
    L2:
      type: object
      required: [l3]
      properties:
        l3:
          $ref: '#/components/schemas/L3'
    L3:
      type: object
      required: [l4]
      properties:
        l4:
          $ref: '#/components/schemas/L4'
    L4:
      type: object
      required: [id, tags]
      properties:
        id:
          type: string
          pattern: '^id-[0-9]+$'
        tags:
          type: array
          minItems: 1
          items:
            type: string
