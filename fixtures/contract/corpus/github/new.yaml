# A hand-trimmed excerpt in the shape of GitHub's public REST API
# description (github.com/github/rest-api-description): a few repository
# and issue endpoints of a later release. Not a verbatim copy; see
# fixtures/contract/README.md.
openapi: 3.0.3
info:
  title: GitHub v3 REST API (excerpt)
  version: 1.1.4
  x-github-plan: api.github.com
servers:
  - url: https://api.github.com
paths:
  /repos/{owner}/{repo}:
    get:
      summary: Get a repository
      operationId: repos/get
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/full-repository'}
        '404': {$ref: '#/components/responses/not_found'}
  /repos/{owner}/{repo}/issues:
    get:
      summary: List repository issues
      operationId: issues/list-for-repo
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - name: state
          in: query
          required: false
          schema: {type: string, enum: [open, closed, all], default: open}
        - name: type
          in: query
          required: false
          schema: {type: string}
        - $ref: '#/components/parameters/per-page'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/issue'}
        '404': {$ref: '#/components/responses/not_found'}
  /repos/{owner}/{repo}/subscription:
    get:
      summary: Get a repository subscription
      operationId: activity/get-repo-subscription
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      responses:
        '200':
          description: if you subscribe to the repository
          content:
            application/json:
              schema:
                type: object
                required: [subscribed, ignored]
                properties:
                  subscribed: {type: boolean}
                  ignored: {type: boolean}
        '404': {description: Not Found if you don't subscribe to the repository}
components:
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema: {type: string}
    repo:
      name: repo
      in: path
      required: true
      schema: {type: string}
    per-page:
      name: per_page
      description: The number of results per page (max 100).
      in: query
      schema: {type: integer, default: 30, maximum: 100}
    page:
      name: page
      description: Page number of the results to fetch.
      in: query
      schema: {type: integer, default: 1}
  responses:
    not_found:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/basic-error'}
  schemas:
    basic-error:
      type: object
      properties:
        message: {type: string}
        documentation_url: {type: string}
    simple-user:
      type: object
      required: [login, id]
      properties:
        login: {type: string}
        id: {type: integer}
        site_admin: {type: boolean}
    full-repository:
      type: object
      required: [id, node_id, name, full_name, owner, private]
      properties:
        id: {type: integer}
        node_id: {type: string}
        name: {type: string}
        full_name: {type: string}
        owner: {$ref: '#/components/schemas/simple-user'}
        private: {type: boolean}
        permissions:
          type: object
          required: [admin, pull, push]
          properties:
            admin: {type: boolean}
            pull: {type: boolean}
            push: {type: boolean}
            maintain: {type: boolean}
            triage: {type: boolean}
    issue:
      type: object
      required: [id, number, state, title, labels]
      properties:
        id: {type: integer}
        number: {type: integer}
        state: {type: string, description: "State of the issue; either 'open' or 'closed'"}
        state_reason:
          type: string
          enum: [completed, reopened, not_planned]
          nullable: true
        title: {type: string}
        body: {type: string, nullable: true}
        locked: {type: boolean}
        labels:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  id: {type: integer}
                  name: {type: string}
        user: {$ref: '#/components/schemas/simple-user'}
