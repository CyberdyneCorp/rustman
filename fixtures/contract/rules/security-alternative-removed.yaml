# basicAuth or bearerAuth becomes bearerAuth only
expect: [security-alternative-removed]
old:
  components: {securitySchemes: {basicAuth: {type: http, scheme: basic}, bearerAuth: {type: http, scheme: bearer}}}
  paths:
    /users:
      get:
        security: [{basicAuth: []}, {bearerAuth: []}]
        responses: {'200': {description: ok}}
new:
  components: {securitySchemes: {basicAuth: {type: http, scheme: basic}, bearerAuth: {type: http, scheme: bearer}}}
  paths:
    /users:
      get:
        security: [{bearerAuth: []}]
        responses: {'200': {description: ok}}
