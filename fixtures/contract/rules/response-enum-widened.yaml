# status gains archived
expect: [response-enum-widened]
old:
  paths:
    /users:
      get:
        responses:
          '200':
            description: ok
            content:
              application/json:
                schema: {type: object, properties: {status: {type: string, enum: [active]}}}
new:
  paths:
    /users:
      get:
        responses:
          '200':
            description: ok
            content:
              application/json:
                schema: {type: object, properties: {status: {type: string, enum: [active, archived]}}}
