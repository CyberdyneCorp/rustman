# $.name maxLength 50 -> 100
expect: [request-constraint-loosened]
old:
  paths:
    /users:
      post:
        requestBody:
          content:
            application/json:
              schema: {type: object, properties: {name: {type: string, maxLength: 50}}}
        responses: {'200': {description: ok}}
new:
  paths:
    /users:
      post:
        requestBody:
          content:
            application/json:
              schema: {type: object, properties: {name: {type: string, maxLength: 100}}}
        responses: {'200': {description: ok}}
