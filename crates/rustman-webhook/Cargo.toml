[package]
name = "rustman-webhook"
description = "Local webhook listener: captures, limits, mocks, signature checks, replay and the event log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rustman-core.workspace = true
rustman-http.workspace = true
base64.workspace = true
bytes.workspace = true
dunce.workspace = true
globset.workspace = true
hmac.workspace = true
http.workspace = true
http-body-util.workspace = true
httparse.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "tokio", "http1", "http2"] }
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "local-offset"] }
tokio = { workspace = true, features = ["net", "time", "rt", "sync", "macros", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }
toml.workspace = true

[dev-dependencies]
rustman-test-support.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "tokio", "http1", "http2"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
