[package]
name = "rustman-mcp"
description = "Rustman over the Model Context Protocol: the agent server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rustman-core.workspace = true
rustman-http.workspace = true
rustman-explore.workspace = true
rustman-report.workspace = true
rustman-jsonrpc.workspace = true
rmcp = { workspace = true, features = ["server", "elicitation", "transport-io", "transport-streamable-http-server"] }
axum.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
ring.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-std", "macros", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
rustman-test-support.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "time"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
http-body-util.workspace = true
http.workspace = true
jsonschema.workspace = true

[lints]
workspace = true
