[package]
name = "rustman-mcp"
description = "Rustman over the Model Context Protocol: the agent server and the MCP client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A scripted stdio MCP server for the client's integration tests.
[[bin]]
name = "rustman-mcp-fixture"
path = "tests/support/mcp_fixture.rs"
test = false
doc = false
bench = false

[dependencies]
rustman-core.workspace = true
rustman-http.workspace = true
rustman-explore.workspace = true
rustman-report.workspace = true
rustman-jsonrpc.workspace = true
rustman-grpc = { workspace = true, optional = true }
rustman-realtime.workspace = true
rmcp = { workspace = true, features = ["server", "client", "elicitation", "transport-io", "transport-async-rw", "transport-streamable-http-server", "transport-streamable-http-client"] }
axum.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
jsonschema.workspace = true
ring.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
sse-stream.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-std", "io-util", "macros", "process", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
toml.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
# Kill a stdio server's whole process group (safe `killpg`).
rustix.workspace = true

[features]
default = ["grpc"]
# The gRPC agent tools (add-grpc-client "Agent tools").
grpc = ["dep:rustman-grpc"]

[dev-dependencies]
rustman-test-support = { workspace = true, features = ["grpc"] }
# The plugin network of agent sessions, under the agent's guard.
rustman-plugin.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "time", "test-util"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
http-body-util.workspace = true

[lints]
workspace = true
