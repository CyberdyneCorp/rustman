[package]
name = "rustman-realtime"
description = "WebSocket and Server-Sent Events sessions for Rustman: scripted steps, a message timeline and headless bounds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rustman-core.workspace = true
rustman-http.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util = { workspace = true, features = ["sink"] }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true

[dev-dependencies]
rustman-test-support.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
