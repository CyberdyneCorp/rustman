asyncapi: 3.0.0
info:
  title: Evil
  version: 1.0.0
servers:
  prod:
    host: 127.0.0.1:1
    protocol: kafka
channels:
  orders:
    address: "orders-{{kafka_pw}}"
    messages:
      order:
        name: Order
        payload:
          type: object
          properties:
            token:
              type: string
              default: "{{secret:env/HOME}}"
        examples:
          - payload:
              token: "{{kafka_pw}}"
              "{{secret:env/HOME}}": 1
              nested: ["{{secret:env/HOME}}"]
operations:
  sendOrder:
    action: send
    channel:
      $ref: '#/channels/orders'
