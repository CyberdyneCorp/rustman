[package]
name = "rustman-messaging"
description = "Kafka, MQTT and AMQP clients for Rustman: produce and consume messages from request files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rustman-core.workspace = true
rustman-http.workspace = true
rustman-explore.workspace = true
apache-avro.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util = { workspace = true, features = ["sink"] }
jiff.workspace = true
jsonschema.workspace = true
lapin.workspace = true
prost-reflect.workspace = true
protox.workspace = true
ring.workspace = true
rskafka.workspace = true
rumqttc.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
url.workspace = true

[dev-dependencies]
insta.workspace = true
rustman-test-support = { workspace = true, features = ["mqtt"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
