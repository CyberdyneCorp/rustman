openapi: 3.1.0
info:
  title: Shop
  version: '2'
servers:
  - url: https://staging.example.com/v2
    description: Staging
  - url: https://api.example.com/v2
    description: Production
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          schema: {type: integer}
        - name: X-Trace
          in: header
          required: true
          schema: {type: string}
      responses:
        '200': {description: OK}
    post:
      operationId: createPet
      tags: [pets]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
            example: {name: Fido}
      responses:
        '201': {description: Created}
  /pets/{petId}:
    get:
      operationId: showPetById
      tags: [pets]
      parameters:
        - {name: petId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [petId, quantity]
              properties:
                petId: {type: string, format: uuid}
                quantity: {type: integer, minimum: 1}
      responses:
        '201': {description: Created}
  /pets/{petId}/photos:
    post:
      operationId: uploadPhoto
      tags: [pets]
      parameters:
        - {name: petId, in: path, required: true, schema: {type: string}}
      responses:
        '201': {description: Created}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
