openapi: 3.1.0
info:
  title: Shop
  version: '1'
servers:
  - url: https://staging.example.com
    description: Staging
  - url: https://api.example.com
    description: Production
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          schema: {type: integer}
      responses:
        '200': {description: OK}
    post:
      operationId: createPet
      tags: [pets]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
            example: {name: Rex}
      responses:
        '201': {description: Created}
  /pets/{petId}:
    get:
      operationId: showPetById
      tags: [pets]
      parameters:
        - {name: petId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
    delete:
      operationId: deletePet
      tags: [pets]
      parameters:
        - {name: petId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Deleted}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
