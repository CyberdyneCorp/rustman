openapi: 3.1.0
info:
  title: Refs
  version: '1'
paths:
  /pets/{petId}:
    parameters:
      - $ref: 'common/parameters.yaml#/PetId'
    get:
      operationId: getPet
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: 'common/pet.yaml#/Pet'
  /trees:
    get:
      operationId: getTree
      responses:
        '200':
          description: A tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
  /same:
    $ref: '#/paths/~1trees'
components:
  schemas:
    Node:
      type: object
      properties:
        name:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/Node'
