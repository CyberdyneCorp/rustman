type: collection.insomnia.rest/5.0
name: Shop API
meta:
  id: wrk_shop
  description: The shop
collection:
  - name: Users
    meta:
      id: fld_users
      sortKey: -1000
    environment:
      page_size: "25"
    children:
      - url: "{{ _.base_url }}/users/1"
        name: Get user
        meta:
          id: req_get
          sortKey: -100
        method: GET
        headers:
          - name: X-User
            value: "{% response 'body', 'req_create', 'b64::JC5pZA==::46b', 'never', 60 %}"
      - url: "{{ _.base_url }}/users?limit=10"
        name: List users
        meta:
          id: req_list
          sortKey: -200
        method: GET
        parameters:
          - name: page
            value: "1"
          - name: debug
            value: "true"
            disabled: true
        headers:
          - name: Accept
            value: application/json
      - url: "{{ _.base_url }}/users"
        name: Create user
        meta:
          id: req_create
          sortKey: -300
        method: POST
        body:
          mimeType: application/json
          text: '{"name": "Ada"}'
        authentication:
          type: bearer
          token: CANARY-insomnia-v5-bearer-c4f1a9
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            insomnia.environment.set("user_id", body.id);
  - url: "{{ _.base_url }}/graphql"
    name: Search products
    meta:
      id: req_graphql
      sortKey: -50
    method: POST
    body:
      mimeType: application/graphql
      text: '{"query":"{ products { id } }"}'
cookieJar:
  name: Default Jar
  meta:
    id: jar_1
environments:
  name: Base Environment
  meta:
    id: env_base
  data:
    base_url: http://localhost:8080
  subEnvironments:
    - name: Prod
      meta:
        id: env_prod
      data:
        base_url: https://shop.example.com
    - name: Private
      meta:
        id: env_private
      isPrivate: true
      data:
        plain: CANARY-insomnia-private-plain-v5
