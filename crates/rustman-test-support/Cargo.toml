[package]
name = "rustman-test-support"
description = "In-process test servers shared by the Rustman test suites (never published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
apollo-compiler.workspace = true
async-compression = { workspace = true, features = ["tokio", "gzip", "brotli", "zstd", "zlib"] }
base64.workspace = true
bytes.workspace = true
form_urlencoded.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
md-5.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "service", "tokio", "http1", "http2"] }
rcgen.workspace = true
ring.workspace = true
p12-keystore.workspace = true
url.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net", "time"] }
tokio-rustls.workspace = true
futures-util = { workspace = true, features = ["sink"] }
tokio-tungstenite.workspace = true
