[package]
name = "rustman-test-support"
description = "In-process test servers shared by the Rustman test suites (never published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
apollo-compiler.workspace = true
async-compression = { workspace = true, features = ["tokio", "gzip", "brotli", "zstd", "zlib"] }
base64.workspace = true
bytes.workspace = true
form_urlencoded.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
md-5.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "service", "tokio", "http1", "http2"] }
rcgen.workspace = true
ring.workspace = true
p12-keystore.workspace = true
url.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net", "sync", "time"] }
tokio-rustls.workspace = true
futures-util = { workspace = true, features = ["sink"] }
tokio-tungstenite.workspace = true
# In-process gRPC servers (add-grpc-client): reflection v1/v1alpha and
# health, over a descriptor pool compiled from `protos/` with protox.
tonic = { workspace = true, optional = true, features = ["server", "router", "codegen", "tls-ring"] }
tonic-prost = { workspace = true, optional = true }
tonic-web = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
tonic-reflection = { workspace = true, optional = true, features = ["server"] }
tonic-health = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
protox = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true, features = ["net"] }
# The in-process MQTT broker (add-messaging-client), over the MQTT codec
# and link of rustman-messaging.
rustman-core = { workspace = true, optional = true }
rustman-messaging = { workspace = true, optional = true }
rumqttc = { workspace = true, optional = true }

[features]
# The in-process OTLP collector (add-trace-propagation section 4).
otlp = ["dep:prost"]
mqtt = ["dep:rustman-core", "dep:rustman-messaging", "dep:rumqttc"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:tonic-web", "dep:tower-service", "dep:tonic-reflection", "dep:tonic-health", "dep:prost", "dep:prost-types", "dep:protox", "dep:tokio-stream"]
