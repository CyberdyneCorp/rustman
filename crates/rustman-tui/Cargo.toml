[package]
name = "rustman-tui"
description = "Terminal user interface for Rustman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rustman-core.workspace = true
rustman-http.workspace = true
rustman-graphql.workspace = true
rustman-jsonrpc.workspace = true
rustman-realtime.workspace = true
rustman-mcp.workspace = true
rustman-grpc.workspace = true
rustman-import.workspace = true
rustman-viz-protocol.workspace = true
rustman-webhook.workspace = true
rustman-mock.workspace = true
ratatui.workspace = true
crossterm.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "signal", "macros"] }
tokio-util.workspace = true
nucleo-matcher.workspace = true
dunce.workspace = true
notify.workspace = true
serde_json.workspace = true
shell-words.workspace = true
tempfile.workspace = true
serde_json_path.workspace = true
syntect.workspace = true
similar.workspace = true
base64.workspace = true
http.workspace = true

[features]
# OTLP export of client spans (add-trace-propagation section 4); off by
# default, so the default build has no opentelemetry crate.
otlp = ["rustman-http/otlp"]

[dev-dependencies]
bytes.workspace = true
time.workspace = true
insta.workspace = true
rustman-test-support = { workspace = true, features = ["grpc"] }
prost-reflect.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "signal", "macros"] }
portable-pty.workspace = true
vt100.workspace = true

[lints]
workspace = true
