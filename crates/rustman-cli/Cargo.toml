[package]
name = "rustman-cli"
description = "Local-first API workbench for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rustman"
path = "src/main.rs"

# Its own executable is the stub viz companion, so it runs without libtest.
[[test]]
name = "bench_viz"
harness = false

[dependencies]
rustman-core.workspace = true
rustman-http.workspace = true
rustman-import.workspace = true
rustman-report.workspace = true
rustman-explore.workspace = true
rustman-messaging.workspace = true
rustman-graphql.workspace = true
rustman-jsonrpc.workspace = true
rustman-grpc.workspace = true
rustman-mcp.workspace = true
rustman-realtime.workspace = true
rustman-tui.workspace = true
rustman-webhook.workspace = true
rustman-mock.workspace = true
rustman-contract.workspace = true
rustman-viz-client.workspace = true
rustman-viz-protocol.workspace = true
rustman-bench.workspace = true
rustman-docs.workspace = true
rustman-monitor.workspace = true
rustman-secrets.workspace = true
# Plugins (add-plugin-system task 1.1): wasmtime, behind the default
# `plugins` feature.
rustman-plugin = { workspace = true, optional = true }
rustman-proxy.workspace = true
clap.workspace = true
clap_complete.workspace = true
anstream.workspace = true
tracing-subscriber.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dunce.workspace = true
tokio = { workspace = true, features = ["rt", "signal", "macros", "net", "sync"] }
tokio-util.workspace = true

[features]
default = ["plugins"]
# WASM component plugins (add-plugin-system). `--no-default-features`
# builds without wasmtime.
plugins = ["dep:rustman-plugin"]
# OTLP export of client spans (add-trace-propagation section 4); off by
# default, so the default build has no opentelemetry crate.
otlp = ["rustman-http/otlp", "rustman-tui/otlp", "rustman-test-support/otlp"]
# Email alerts for monitors over SMTP (add-scheduled-monitors design D5).
smtp = ["rustman-monitor/smtp"]
# Cloud secret providers (add-secret-providers design D4); off for a plain
# build. Release builds enable `cloud-secrets`, which is all three.
secrets-aws = ["rustman-secrets/secrets-aws"]
secrets-gcp = ["rustman-secrets/secrets-gcp"]
secrets-azure = ["rustman-secrets/secrets-azure"]
cloud-secrets = ["secrets-aws", "secrets-gcp", "secrets-azure"]
# Test hooks of `rustman record` (a stand-in keychain directory and a stop
# after N captures, see src/commands/record/test_hooks.rs). Never enabled
# in a build that is shipped or installed: only this crate's own tests turn
# it on, through the dev-dependency on itself below.
record-test-hooks = []

[dev-dependencies]
# The integration tests run `rustman record --intercept` and the `ca`
# commands with the test hooks on every platform; a dev-dependency only
# applies to test builds, never to `cargo build`, `cargo install` or
# `cargo run`.
rustman-cli = { path = ".", default-features = false, features = ["record-test-hooks"] }
assert_cmd.workspace = true
# Test plugins built in-process (add-plugin-system).
rustman-plugin = { workspace = true, features = ["test-fixtures"] }
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
bytes.workspace = true
insta.workspace = true
jsonschema.workspace = true
roxmltree.workspace = true
rustman-test-support = { workspace = true, features = ["grpc", "mqtt"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
predicates.workspace = true
regex.workspace = true
rskafka.workspace = true
rumqttc.workspace = true
shell-words.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(unix)'.dev-dependencies]
portable-pty.workspace = true

[lints]
workspace = true
