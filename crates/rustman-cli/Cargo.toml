[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
jsonschema.workspace = true
roxmltree.workspace = true
rustman-test-support.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
