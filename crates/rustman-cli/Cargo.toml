[package]
name = "rustman-cli"
description = "Local-first API workbench for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rustman"
path = "src/main.rs"

[dependencies]
rustman-core.workspace = true
rustman-http.workspace = true
rustman-import.workspace = true
rustman-report.workspace = true
rustman-explore.workspace = true
rustman-graphql.workspace = true
rustman-jsonrpc.workspace = true
rustman-grpc.workspace = true
rustman-mcp.workspace = true
rustman-tui.workspace = true
rustman-webhook.workspace = true
rustman-mock.workspace = true
clap.workspace = true
clap_complete.workspace = true
anstream.workspace = true
tracing-subscriber.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dunce.workspace = true
tokio = { workspace = true, features = ["rt", "signal", "macros", "net"] }
tokio-util.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
base64.workspace = true
insta.workspace = true
jsonschema.workspace = true
roxmltree.workspace = true
rustman-test-support = { workspace = true, features = ["grpc"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
predicates.workspace = true
regex.workspace = true
shell-words.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
portable-pty.workspace = true

[lints]
workspace = true
