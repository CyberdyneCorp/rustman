[package]
name = "rustman-cli"
description = "Local-first API workbench for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rustman"
path = "src/main.rs"

# Its own executable is the stub viz companion, so it runs without libtest.
[[test]]
name = "bench_viz"
harness = false

[dependencies]
rustman-core.workspace = true
rustman-http.workspace = true
rustman-import.workspace = true
rustman-report.workspace = true
rustman-explore.workspace = true
rustman-graphql.workspace = true
rustman-jsonrpc.workspace = true
rustman-grpc.workspace = true
rustman-mcp.workspace = true
rustman-realtime.workspace = true
rustman-tui.workspace = true
rustman-webhook.workspace = true
rustman-mock.workspace = true
rustman-contract.workspace = true
rustman-viz-client.workspace = true
rustman-viz-protocol.workspace = true
rustman-bench.workspace = true
rustman-docs.workspace = true
rustman-monitor.workspace = true
clap.workspace = true
clap_complete.workspace = true
anstream.workspace = true
tracing-subscriber.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dunce.workspace = true
tokio = { workspace = true, features = ["rt", "signal", "macros", "net", "sync"] }
tokio-util.workspace = true

[features]
# OTLP export of client spans (add-trace-propagation section 4); off by
# default, so the default build has no opentelemetry crate.
otlp = ["rustman-http/otlp", "rustman-tui/otlp", "rustman-test-support/otlp"]
# Email alerts for monitors over SMTP (add-scheduled-monitors design D5).
smtp = ["rustman-monitor/smtp"]

[dev-dependencies]
assert_cmd.workspace = true
base64.workspace = true
insta.workspace = true
jsonschema.workspace = true
roxmltree.workspace = true
rustman-test-support = { workspace = true, features = ["grpc"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
predicates.workspace = true
regex.workspace = true
shell-words.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
portable-pty.workspace = true

[lints]
workspace = true
